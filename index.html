<!DOCTYPE html>

<title>Islam - Plateforme Complète</title>

<style>
:root{
--primary:#0f3d2e;
--gold:#d4af37;
--bg:#f4f6f5;
--text:#1a1a1a;
--card:#ffffff;
}

body.dark{
--bg:#0e1a17;
--text:#f2f2f2;
--card:#1c2b27;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Poppins',sans-serif;
background:var(--bg);
color:var(--text);
transition:0.3s;
}

body[dir="rtl"]{
font-family:'Cairo',sans-serif;
text-align:right;
}

header{
position:fixed;
width:100%;
background:var(--primary);
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
z-index:1000;
}

.logo{
color:var(--gold);
font-weight:700;
font-size:1.2rem;
}

nav{
display:flex;
gap:15px;
align-items:center;
}

nav a, nav select{
color:white;
background:none;
border:none;
font-size:0.8rem;
cursor:pointer;
text-decoration:none;
}

.hamburger{
display:none;
font-size:26px;
color:white;
cursor:pointer;
}

section{
padding:110px 40px;
min-height:100vh;
}

.hero{
background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
url('https://images.unsplash.com/photo-1524492412937-b28074a5d7da') center/cover;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.card{
background:var(--card);
padding:25px;
border-radius:12px;
margin-top:20px;
box-shadow:0 8px 25px rgba(0,0,0,0.1);
}

.ayah{
padding:15px;
margin:10px 0;
border-left:4px solid var(--gold);
background:rgba(0,0,0,0.03);
border-radius:6px;
}

body.dark .ayah{
background:rgba(255,255,255,0.05);
}

button{
background:var(--primary);
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

#map{
height:350px;
margin-top:20px;
}

footer{
background:var(--primary);
color:white;
text-align:center;
padding:20px;
}

@media(max-width:768px){
nav{
position:absolute;
top:70px;
right:0;
flex-direction:column;
background:var(--primary);
width:230px;
padding:20px;
display:none;
}
nav.active{display:flex;}
.hamburger{display:block;}
}


section{
opacity:0;
transform:translateY(40px);
transition:0.6s;
}

section.visible{
opacity:1;
transform:translateY(0);
}

button:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}


#namesList{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

@media(max-width:768px){
#namesList{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:480px){
#namesList{
grid-template-columns:1fr;
}
}

.name-card{
background:var(--card);
padding:15px;
border-radius:12px;
box-shadow:0 6px 15px rgba(0,0,0,0.08);
text-align:center;
transition:0.3s;
position:relative;
}

.name-card:hover{
transform:translateY(-5px);
box-shadow:0 12px 25px rgba(0,0,0,0.15);
}

.number{
position:absolute;
top:8px;
left:10px;
font-size:0.8rem;
color:var(--gold);
font-weight:bold;
}

body[dir="rtl"] .number{
left:auto;
right:10px;
}

</style>

function toggleMenu(){document.getElementById("nav").classList.toggle("active");}
function toggleDark(){document.body.classList.toggle("dark");}

/* ===== PRIERE ===== */
function getPrayerTimes(){
navigator.geolocation.getCurrentPosition(pos=>{
fetch(`https://api.aladhan.com/v1/timings?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&method=2`)
.then(res=>res.json())
.then(data=>{
let t=data.data.timings;
let lang = localStorage.getItem("lang") || "fr";

document.getElementById("prayerTimes").innerHTML=
`${translations[lang].prayer_fajr}: ${t.Fajr}<br>
${translations[lang].prayer_dhuhr}: ${t.Dhuhr}<br>
${translations[lang].prayer_asr}: ${t.Asr}<br>
${translations[lang].prayer_maghrib}: ${t.Maghrib}<br>
${translations[lang].prayer_isha}: ${t.Isha}`;
});
});
}

/* ===== CORAN ===== */
fetch("https://api.alquran.cloud/v1/surah")
.then(res=>res.json())
.then(data=>{
window.allSurahs=data.data;
displaySurahs(window.allSurahs);
});

function displaySurahs(list){
document.getElementById("surahList").innerHTML=
list.map(s=>`<p style="cursor:pointer" onclick="loadSurah(${s.number})">${s.number}. ${s.englishName}</p>`).join("");
}

function searchSurah(val){
let filtered=window.allSurahs.filter(s=>s.englishName.toLowerCase().includes(val.toLowerCase()));
displaySurahs(filtered);
}

function loadSurah(num){
fetch(`https://api.alquran.cloud/v1/surah/${num}/editions/quran-uthmani,en.asad,fr.hamidullah`)
.then(res=>res.json())
.then(data=>{
let arabic=data.data[0].ayahs;
let english=data.data[1].ayahs;
let french=data.data[2].ayahs;

document.getElementById("ayahDisplay").innerHTML=
arabic.map((a,i)=>
`<div class="ayah">
<strong>${a.numberInSurah}</strong><br>
${a.text}<br>
<em>${english[i].text}</em><br>
<small>${french[i].text}</small>
</div>`
).join("");
});
}

/* ===== TASBIH ===== */
let count=localStorage.getItem("tasbih")||0;
document.getElementById("counter").innerText=count;
function increment(){count++;localStorage.setItem("tasbih",count);document.getElementById("counter").innerText=count;}
function resetCounter(){count=0;localStorage.setItem("tasbih",0);document.getElementById("counter").innerText=0;}

/* ===== MAP ===== */
navigator.geolocation.getCurrentPosition(pos=>{
let lat = pos.coords.latitude;
let lon = pos.coords.longitude;

let map = L.map('map').setView([lat, lon], 14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

let userIcon = L.icon({
iconUrl:'https://cdn-icons-png.flaticon.com/512/64/64113.png',
iconSize:[30,30]
});

let mosqueIcon = L.icon({
iconUrl:'https://cdn-icons-png.flaticon.com/512/3179/3179068.png',
iconSize:[30,30]
});

L.marker([lat,lon],{icon:userIcon})
.addTo(map)
.bindPopup("📍 Vous êtes ici");

L.circle([lat,lon],{
radius:3000,
color:'#d4af37',
fillOpacity:0.1
}).addTo(map);

const query = `
[out:json];
node
["amenity"="place_of_worship"]
["religion"="muslim"]
(around:3000,${lat},${lon});
out;
`;

fetch("https://overpass-api.de/api/interpreter", {
method: "POST",
body: query
})
.then(res => res.json())
.then(data => {
data.elements.forEach(m => {
L.marker([m.lat, m.lon], {icon: mosqueIcon})
.addTo(map)
.bindPopup(`
<strong>${m.tags.name || "Mosquée"}</strong><br>
<a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lon}">
🧭 Itinéraire
</a>
`);
});
})
.catch(err=>{
console.log("Erreur mosquées :", err);
});

function changeLanguage(lang){

localStorage.setItem("lang",lang);
document.documentElement.lang=lang;
document.body.setAttribute("dir",lang==="ar"?"rtl":"ltr");

document.querySelectorAll("[data-i18n]").forEach(el=>{
el.innerText=translations[lang][el.dataset.i18n];
});

/* Traduction placeholders */
document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
el.placeholder = translations[lang][el.dataset.i18nPlaceholder];
});

/* Traduction boutons */
document.querySelector("#membre button:nth-child(3)").innerText =
translations[lang].member_register;

document.querySelector("#membre button:nth-child(4)").innerText =
translations[lang].member_login;

document.querySelector("#tasbih button:nth-child(3)").innerText =
translations[lang].tasbih_reset;

displayNames();

}

async function hashPassword(password){
const encoder = new TextEncoder();
const data = encoder.encode(password);
const hash = await crypto.subtle.digest("SHA-256", data);
return Array.from(new Uint8Array(hash))
.map(b => b.toString(16).padStart(2, "0"))
.join("");
}

async function register(){
if(!email.value || !password.value){
status.innerText="Champs requis";
return;
}
const hashed = await hashPassword(password.value);
localStorage.setItem(email.value, hashed);
status.innerText="Compte sécurisé créé";
}

}
}
